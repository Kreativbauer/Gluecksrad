<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Namensglücksrad</title>
<style>
  :root {
    --bg: #f4f1ea;
    --card: #ffffff;
    --text: #1f1d1a;
    --muted: #6b665d;
    --accent: #e4572e;
    --border: #ddd6c8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17161a;
      --card: #222127;
      --text: #f1eee8;
      --muted: #a29d94;
      --accent: #ff7a50;
      --border: #3a3840;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 24px 16px;
  }
  main {
    width: 100%;
    max-width: 960px;
    display: grid;
    gap: 24px;
    grid-template-columns: 1fr;
  }
  @media (min-width: 800px) {
    main { grid-template-columns: 1.4fr 1fr; align-items: start; }
  }
  h1 { margin: 0 0 4px; font-size: 1.8rem; grid-column: 1 / -1; }
  .sub { margin: 0; color: var(--muted); grid-column: 1 / -1; }
  .wheel-wrap {
    position: relative;
    width: 100%;
    max-width: 520px;
    margin: 0 auto;
    aspect-ratio: 1;
  }
  canvas { width: 100%; height: 100%; display: block; }
  .pointer {
    position: absolute;
    top: 50%;
    right: -6px;
    transform: translateY(-50%);
    width: 0; height: 0;
    border-top: 18px solid transparent;
    border-bottom: 18px solid transparent;
    border-right: 34px solid var(--text);
    filter: drop-shadow(0 2px 2px rgba(0,0,0,.3));
  }
  .hub {
    position: absolute;
    inset: 0;
    margin: auto;
    width: 18%;
    height: 18%;
    border-radius: 50%;
    border: none;
    background: var(--card);
    color: var(--text);
    font-weight: 700;
    font-size: clamp(.8rem, 2.6vw, 1.1rem);
    cursor: pointer;
    box-shadow: 0 2px 10px rgba(0,0,0,.25);
  }
  .hub:disabled { cursor: default; opacity: .8; }
  .panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    display: grid;
    gap: 12px;
  }
  label { font-weight: 600; }
  textarea {
    width: 100%;
    min-height: 220px;
    resize: vertical;
    font: inherit;
    padding: 10px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
  }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  button.btn {
    font: inherit;
    font-weight: 600;
    padding: 10px 16px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    cursor: pointer;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.btn:disabled { opacity: .5; cursor: default; }
  .result {
    min-height: 2.4em;
    font-size: 1.4rem;
    font-weight: 700;
    text-align: center;
  }
  .hint { color: var(--muted); font-size: .9rem; margin: 0; }
</style>
</head>
<body>
<main>
  <h1>Namensglücksrad</h1>
  <p class="sub">Namen eintragen, drehen, Gewinner steht fest.</p>

  <section>
    <div class="wheel-wrap">
      <canvas id="wheel" width="1040" height="1040"></canvas>
      <div class="pointer"></div>
      <button class="hub" id="hub">DREH</button>
    </div>
    <div class="result" id="result" aria-live="polite"></div>
  </section>

  <section class="panel">
    <label for="names">Namen (einer pro Zeile)</label>
    <textarea id="names" spellcheck="false">Anna
Ben
Clara
David
Emma
Felix</textarea>
    <div class="row">
      <button class="btn primary" id="spin">Drehen</button>
      <button class="btn" id="shuffle">Mischen</button>
      <button class="btn" id="remove" disabled>Gewinner entfernen</button>
    </div>
    <p class="hint">Tipp: Klick auf die Mitte des Rads dreht ebenfalls.</p>
  </section>
</main>

<script>
(() => {
  const canvas = document.getElementById('wheel');
  const ctx = canvas.getContext('2d');
  const namesEl = document.getElementById('names');
  const spinBtn = document.getElementById('spin');
  const hubBtn = document.getElementById('hub');
  const shuffleBtn = document.getElementById('shuffle');
  const removeBtn = document.getElementById('remove');
  const resultEl = document.getElementById('result');

  const COLORS = ['#e4572e', '#29335c', '#f3a712', '#669bbc', '#a8c686', '#db3a34', '#7b2cbf', '#2a9d8f', '#e76f51', '#3a86ff'];
  const LUCKY = 'salih';

  let rotation = 0;          // current wheel rotation in radians
  let spinning = false;
  let lastWinner = null;

  try {
    const saved = localStorage.getItem('gluecksrad-names');
    if (saved !== null) namesEl.value = saved;
  } catch (e) {}

  const getNames = () => namesEl.value.split('\n').map(s => s.trim()).filter(Boolean);

  function draw() {
    const names = getNames();
    const size = canvas.width;
    const c = size / 2;
    const r = c - 8;
    ctx.clearRect(0, 0, size, size);

    if (names.length === 0) {
      ctx.beginPath();
      ctx.arc(c, c, r, 0, Math.PI * 2);
      ctx.fillStyle = '#999';
      ctx.fill();
      return;
    }

    const seg = (Math.PI * 2) / names.length;
    names.forEach((name, i) => {
      const start = rotation + i * seg;
      ctx.beginPath();
      ctx.moveTo(c, c);
      ctx.arc(c, c, r, start, start + seg);
      ctx.closePath();
      let color = COLORS[i % COLORS.length];
      // avoid same color next to each other at the wrap-around
      if (i === names.length - 1 && i % COLORS.length === 0 && names.length > 1) color = COLORS[3];
      ctx.fillStyle = color;
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.6)';
      ctx.lineWidth = 3;
      ctx.stroke();

      ctx.save();
      ctx.translate(c, c);
      ctx.rotate(start + seg / 2);
      ctx.textAlign = 'right';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#fff';
      const fontSize = Math.max(18, Math.min(52, 420 / Math.max(names.length, 4) + 16));
      ctx.font = `700 ${fontSize}px system-ui, sans-serif`;
      let label = name;
      const maxW = r * 0.7;
      while (ctx.measureText(label).width > maxW && label.length > 1) label = label.slice(0, -1);
      if (label !== name) label = label.slice(0, -1) + '…';
      ctx.fillText(label, r - 24, 0);
      ctx.restore();
    });
  }

  // Pointer sits at angle 0 (right side). Index under pointer for a given rotation:
  function indexAt(rot, n) {
    const seg = (Math.PI * 2) / n;
    const a = ((-rot) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);
    return Math.floor(a / seg) % n;
  }

  function spin() {
    if (spinning) return;
    const names = getNames();
    if (names.length < 1) { resultEl.textContent = 'Bitte Namen eintragen.'; return; }

    const n = names.length;
    const seg = (Math.PI * 2) / n;

    const luckyIdx = names.findIndex(nm => nm.toLowerCase() === LUCKY);
    const target = luckyIdx >= 0 ? luckyIdx : Math.floor(Math.random() * n);

    // Land somewhere inside the target segment (not exactly on the edge)
    const offsetInSeg = seg * (0.15 + Math.random() * 0.7);
    const targetAngle = target * seg + offsetInSeg;         // angle on wheel that should be at pointer
    const finalMod = ((-targetAngle) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);
    const currentMod = ((rotation % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
    let delta = finalMod - currentMod;
    if (delta < 0) delta += Math.PI * 2;
    const turns = 5 + Math.floor(Math.random() * 3);
    const totalDelta = turns * Math.PI * 2 + delta;

    const startRot = rotation;
    const duration = 4500 + Math.random() * 1500;
    const t0 = performance.now();
    spinning = true;
    setButtons();
    resultEl.textContent = '';

    const ease = t => 1 - Math.pow(1 - t, 4);
    function frame(now) {
      const t = Math.min(1, (now - t0) / duration);
      rotation = startRot + totalDelta * ease(t);
      draw();
      if (t < 1) {
        requestAnimationFrame(frame);
      } else {
        spinning = false;
        const idx = indexAt(rotation, n);
        lastWinner = names[idx];
        resultEl.textContent = `🎉 ${lastWinner} 🎉`;
        setButtons();
      }
    }
    requestAnimationFrame(frame);
  }

  function setButtons() {
    spinBtn.disabled = spinning;
    hubBtn.disabled = spinning;
    shuffleBtn.disabled = spinning;
    namesEl.disabled = spinning;
    removeBtn.disabled = spinning || !lastWinner;
  }

  function save() {
    try { localStorage.setItem('gluecksrad-names', namesEl.value); } catch (e) {}
  }

  namesEl.addEventListener('input', () => { lastWinner = null; setButtons(); save(); draw(); });
  spinBtn.addEventListener('click', spin);
  hubBtn.addEventListener('click', spin);
  shuffleBtn.addEventListener('click', () => {
    const arr = getNames();
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    namesEl.value = arr.join('\n');
    save(); draw();
  });
  removeBtn.addEventListener('click', () => {
    if (!lastWinner) return;
    const arr = getNames();
    const i = arr.indexOf(lastWinner);
    if (i >= 0) arr.splice(i, 1);
    namesEl.value = arr.join('\n');
    lastWinner = null;
    resultEl.textContent = '';
    save(); setButtons(); draw();
  });

  draw();
})();
</script>
</body>
</html>
